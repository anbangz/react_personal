version: 0.2

phases:
  install:
    commands:
      - wget -qO /tmp/terraform_1.9.8_linux_amd64.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
      - wget -qO /tmp/terraform_SHA256SUMS https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_SHA256SUMS
      - (cd /tmp && grep 'terraform_1.9.8_linux_amd64.zip' terraform_SHA256SUMS | sha256sum -c -)
      - unzip -o /tmp/terraform_1.9.8_linux_amd64.zip -d /usr/local/bin/
      - terraform --version
  build:
    commands:
      - |
        cat > /tmp/terraform-codebuild-bootstrap-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "TerraformBootstrapReadAndCreate",
              "Effect": "Allow",
              "Action": [
                "lambda:GetFunctionCodeSigningConfig",
                "iam:CreateServiceLinkedRole",
                "cloudfront:CreateOriginAccessControl",
                "cloudfront:GetOriginAccessControl",
                "cloudfront:UpdateOriginAccessControl",
                "cloudfront:DeleteOriginAccessControl",
                "cloudfront:ListOriginAccessControls"
              ],
              "Resource": "*"
            }
          ]
        }
        EOF
      - aws iam put-role-policy --role-name TerraformCodeBuildRole --policy-name TerraformCodeBuildBootstrap --policy-document file:///tmp/terraform-codebuild-bootstrap-policy.json
      - python3 -c "import zipfile; z=zipfile.ZipFile('$CODEBUILD_SRC_DIR/infrastructure-terraform/lambda-placeholder.zip','w'); z.writestr('placeholder.txt','placeholder for initial lambda provisioning'); z.close()"
      - terraform -chdir="$CODEBUILD_SRC_DIR/infrastructure-terraform" init -input=false
      - terraform -chdir="$CODEBUILD_SRC_DIR/infrastructure-terraform" plan -input=false
